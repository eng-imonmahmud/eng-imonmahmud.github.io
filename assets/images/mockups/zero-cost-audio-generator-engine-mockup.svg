    <rect x="40" y="18" width="4" height="14" rx="2" fill="#38BDF8"/>
    <rect x="48" y="2" width="4" height="46" rx="2" fill="#10B981"/>
    <rect x="56" y="12" width="4" height="26" rx="2" fill="#F59E0B"/>
    <rect x="64" y="0" width="4" height="50" rx="2" fill="#34D399"/>
    <rect x="72" y="6" width="4" height="38" rx="2" fill="#38BDF8"/>
    <rect x="80" y="14" width="4" height="22" rx="2" fill="#10B981"/>
    <rect x="88" y="4" width="4" height="42" rx="2" fill="#F59E0B"/>
    <rect x="96" y="16" width="4" height="18" rx="2" fill="#34D399"/>
    <rect x="104" y="1" width="4" height="48" rx="2" fill="#38BDF8"/>
    <rect x="112" y="10" width="4" height="30" rx="2" fill="#10B981"/>
    <rect x="120" y="5" width="4" height="40" rx="2" fill="#F59E0B"/>
    <rect x="128" y="15" width="4" height="20" rx="2" fill="#34D399"/>
    <rect x="136" y="2" width="4" height="46" rx="2" fill="#38BDF8"/>
    <rect x="144" y="12" width="4" height="26" rx="2" fill="#10B981"/>
    <rect x="152" y="18" width="4" height="14" rx="2" fill="#F59E0B"/>
  </g>
  
  <text x="410" y="225" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6EE7B7" text-anchor="middle">5-Stage Exponential Backoff</text>
  <text x="410" y="242" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Pitch: +10Hz | Rate: +5%</text>

  <!-- Arrow 2 -->
  <path d="M 515 180 L 555 180" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="555,175 565,180 555,185" fill="#10B981"/>

  <!-- Right Box: MoviePy Audio Stitcher & Master MP3 -->
  <rect x="570" y="110" width="160" height="140" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="650" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle" font-weight="700">🎛️ Master Output</text>
  
  <rect x="585" y="150" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="170" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E2E8F0" text-anchor="middle" font-weight="600">📁 pyaudio/</text>
  
  <rect x="585" y="190" width="130" height="42" rx="6" fill="#064E3B" stroke="#059669"/>
  <text x="650" y="208" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" text-anchor="middle" font-weight="bold">🎵 master_audio.mp3</text>
  <text x="650" y="222" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6EE7B7" text-anchor="middle">Studio-Grade Audio</text>

  <!-- Bottom Terminal Log Output -->
  <rect x="80" y="280" width="650" height="110" rx="10" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
  <text x="100" y="305" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">● [stoaudio.py] Processing: scripts/The_Future_of_AI_Technology/</text>
  <text x="100" y="325" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">↳ [Chunk 1..4] Synthesizing audio with Edge Neural TTS (en-US-GuyNeural)... [OK]</text>
  <text x="100" y="345" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">↳ [MoviePy] Concatenating 4 audio parts in numerical order... [OK]</text>
  <text x="100" y="365" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F59E0B">✔ Master MP3 Exported: pyaudio/The_Future_of_AI_Technology.mp3 (0% API Token Cost)</text>
