<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#062016"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.07" stroke="#10B981" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Frame -->
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#1E293B" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="40" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <rect x="50" y="64" width="700" height="16" fill="#0F172A"/>
  
  <!-- Window Controls -->
  <circle cx="75" cy="60" r="5" fill="#EF4444"/>
  <circle cx="95" cy="60" r="5" fill="#F59E0B"/>
  <circle cx="115" cy="60" r="5" fill="#10B981"/>
  
  <text x="400" y="64" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="600">Zero-Cost Audio Generator Engine • stoaudio.py</text>
  
  <!-- Badge -->
  <rect x="580" y="50" width="150" height="20" rx="6" fill="#065F46" fill-opacity="0.6" stroke="#059669" stroke-width="1"/>
  <text x="655" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" text-anchor="middle" font-weight="700">100% FREE • EDGE TTS</text>

  <!-- Content Graphic: Waveform & Flow -->
  <!-- Left Box: Multi-part scripts -->
  <rect x="80" y="110" width="170" height="140" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="165" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#38BDF8" text-anchor="middle" font-weight="700">📄 Multi-Part Scripts</text>
  <rect x="100" y="150" width="130" height="16" rx="4" fill="#1E293B"/>
  <text x="110" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">script_part_1.txt</text>
  <rect x="100" y="172" width="130" height="16" rx="4" fill="#1E293B"/>
  <text x="110" y="184" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">script_part_2.txt</text>
  <rect x="100" y="194" width="130" height="16" rx="4" fill="#1E293B"/>
  <text x="110" y="206" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">script_part_n.txt</text>
  <rect x="100" y="218" width="130" height="18" rx="4" fill="#064E3B"/>
  <text x="165" y="231" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399" text-anchor="middle" font-weight="bold">split_text_smart()</text>

  <!-- Arrow 1 -->
  <path d="M 255 180 L 295 180" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="295,175 305,180 295,185" fill="#10B981"/>

  <!-- Center Box: Edge Neural TTS Async Loop -->
  <rect x="310" y="100" width="200" height="160" rx="12" fill="#022C22" stroke="#059669" stroke-width="2" filter="url(#glow)"/>
  <rect x="310" y="100" width="200" height="160" rx="12" fill="#022C22" stroke="#10B981" stroke-width="1.5"/>
  <text x="410" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#34D399" text-anchor="middle" font-weight="800">⚡ Edge Neural TTS</text>
  
  <!-- Audio Waveform Visualizer -->
  <g transform="translate(330, 145)">
    <rect x="0" y="15" width="4" height="20" rx="2" fill="#34D399"/>
    <rect x="8" y="5" width="4" height="40" rx="2" fill="#38BDF8"/>
    <rect x="16" y="10" width="4" height="30" rx="2" fill="#10B981"/>
    <rect x="24" y="0" width="4" height="50" rx="2" fill="#F59E0B"/>
